# SPDX-License-Identifier: GPL-2.0-only
name: rusix verification
# Hosted execution is disabled in GitHub and requires explicit project-owner approval.
# Keep this manual-only; normal verification runs locally in the pinned container.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: One verification profile (hosted execution requires approval)
        required: true
        default: brd-rust
        type: choice
        options: [kunit, brd, brd-rust, brd-kunit, brd-ext4-c, brd-ext4-rust, server]

permissions:
  contents: read

concurrency:
  group: rusix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: x86_64 / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSIX_CI_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          printf 'RUSIX_CI_OUTPUT=%s/rusix-%s\n' "$RUNNER_TEMP" "$RUSIX_CI_PROFILE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rusix-$RUSIX_CI_PROFILE/logs"
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch pinned C reference
        run: git fetch --no-tags --depth=1 origin 2926d88bb7fc4608fd942453d929c39e4e5ec006
      - name: Build pinned toolchain image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUSIX_CI_OUTPUT/logs"
          docker build --platform linux/amd64 --progress plain \
            -t rusix-toolchain:ci rusix/ci 2>&1 \
            | tee "$RUSIX_CI_OUTPUT/logs/container-build.log"
      - name: Build pinned ext4 utility image
        if: startsWith(inputs.profile, 'brd-ext4-') || inputs.profile == 'server'
        shell: bash
        run: |
          set -o pipefail
          docker build --pull=false --build-arg TOOLCHAIN_IMAGE=rusix-toolchain:ci \
            -t rusix-ext4:ci -f rusix/tests/brd-ext4/Dockerfile rusix/tests/brd-ext4 \
            2>&1 | tee "$RUSIX_CI_OUTPUT/logs/ext4-container-build.log"
      - name: Build and test in container
        shell: bash
        run: |
          set -o pipefail
          case "$RUSIX_CI_PROFILE" in
            brd-ext4-*|server) image=rusix-ext4:ci ;;
            *) image=rusix-toolchain:ci ;;
          esac
          bash rusix/ci/run-container.sh "$image" \
            "$RUSIX_CI_OUTPUT" "$RUSIX_CI_PROFILE" 2>&1 \
            | tee "$RUSIX_CI_OUTPUT/logs/ci-console.log"
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rusix-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.RUSIX_CI_OUTPUT }}/logs/
            ${{ env.RUSIX_CI_OUTPUT }}/builds/ci-*/arch/x86/boot/bzImage
            ${{ env.RUSIX_CI_OUTPUT }}/builds/brd-vm-*/init
            ${{ env.RUSIX_CI_OUTPUT }}/builds/brd-vm-*/initramfs.cpio
            ${{ env.RUSIX_CI_OUTPUT }}/builds/ext4-vm-*/initramfs.cpio
            ${{ env.RUSIX_CI_OUTPUT }}/builds/brd-parameters-vm-*/initramfs.cpio
            ${{ env.RUSIX_CI_OUTPUT }}/builds/ci-server/vmlinux
            ${{ env.RUSIX_CI_OUTPUT }}/builds/ci-server/vmlinux.map
